name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: anima compile examples/twohand_sword_slash/motion.json --output /tmp/anima-example --scale 1 --auto-retime 2
      - run: anima retime examples/twohand_sword_slash/motion.json --output /tmp/anima-example/motion.retimed.json --normalize --iterations 2
      - name: Self-validate generated control sheet
        run: |
          anima verify-render /tmp/anima-example/motion.normalized.json /tmp/anima-example/control_sheet.png \
            --columns 4 \
            --output /tmp/anima-example/control_render_validation.json
      - name: Physics summary
        run: |
          cat /tmp/anima-example/diagnostics_summary.json
          cat /tmp/anima-example/physics_validation.json
          cat /tmp/anima-example/timing_recommendation.json
      - name: Strict canonical gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/anima-example")
          geometry = json.loads((root / "validation.json").read_text())
          physics = json.loads((root / "physics_validation.json").read_text())
          if not geometry["ok"] or not physics["ok"]:
              raise SystemExit(
                  "canonical validation failed: "
                  f"geometry={geometry} physics={physics}"
              )
          PY
      - name: Upload canonical example diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anima-example
          path: /tmp/anima-example
          if-no-files-found: error
