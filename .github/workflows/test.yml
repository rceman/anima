name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: anima compile examples/twohand_sword_slash/motion.json --output /tmp/anima-example --scale 1 --auto-retime 2 --strict-physics
      - run: anima retime examples/twohand_sword_slash/motion.json --output /tmp/anima-example/motion.retimed.json --normalize --iterations 2
      - name: Physics summary
        run: |
          cat /tmp/anima-example/diagnostics_summary.json
          cat /tmp/anima-example/physics_validation.json
          cat /tmp/anima-example/timing_recommendation.json
      - name: Upload canonical example diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: anima-example
          path: /tmp/anima-example
          if-no-files-found: error
