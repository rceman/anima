name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: anima compile examples/twohand_sword_slash/motion.json --output /tmp/anima-example --scale 1
      - name: Physics summary
        run: |
          cat /tmp/anima-example/physics_validation.json
          cat /tmp/anima-example/timing_recommendation.json
